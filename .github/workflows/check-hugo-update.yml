name: Check Hugo Update
on:
  schedule:
    - cron: '0 0 * * 1'  # 每周一 UTC 0 点检查一次
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: hugo-update
  cancel-in-progress: false

jobs:
  check-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get current version
        id: current
        run: echo "version=$(cat .hugo-version)" >> "$GITHUB_OUTPUT"

      - name: Get latest Hugo release
        id: latest
        run: |
          latest=$(curl -s https://api.github.com/repos/gohugoio/hugo/releases/latest | jq -r '.tag_name | ltrimstr("v")')
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        run: |
          current="${{ steps.current.outputs.version }}"
          latest="${{ steps.latest.outputs.version }}"
          # sort -V 按版本号语义比较，仅当最新版大于当前版时更新
          if [ "$(printf '%s\n' "$current" "$latest" | sort -V | tail -n 1)" = "$latest" ] && [ "$current" != "$latest" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update .hugo-version
        if: steps.compare.outputs.update == 'true'
        run: echo "${{ steps.latest.outputs.version }}" > .hugo-version

      - name: Create Pull Request
        if: steps.compare.outputs.update == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ci/update-hugo
          commit-message: "chore: bump Hugo to ${{ steps.latest.outputs.version }}"
          title: "chore: bump Hugo to ${{ steps.latest.outputs.version }}"
          body: |
            Hugo 检测到新版本，自动更新 `.hugo-version`。

            - 当前版本：`${{ steps.current.outputs.version }}`
            - 最新版本：`${{ steps.latest.outputs.version }}`

            更新内容请参考 [Hugo v${{ steps.latest.outputs.version }} Release Notes](https://github.com/gohugoio/hugo/releases/tag/v${{ steps.latest.outputs.version }})。
          delete-branch: true
