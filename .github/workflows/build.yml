name: Build Check
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive  # 拉取主题子模块
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          extended: true  # 版本从 .hugo-version 文件读取

      - name: Cache Hugo resources
        uses: actions/cache@v6
        with:
          path: resources
          key: ${{ runner.os }}-hugo-${{ hashFiles('config/**') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      - name: Build
        run: hugo --minify --gc --cleanDestinationDir
