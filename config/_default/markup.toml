# -- Markup --
# 这些设置是主题正常运行所必需的（Mermaid、KaTeX 等）

[goldmark]
  [goldmark.parser]
    wrapStandAloneImageWithinParagraph = false

    [goldmark.parser.attribute]
      block = true

  [goldmark.renderer]
    unsafe = true

  [goldmark.extensions]
    [goldmark.extensions.passthrough]
      enable = true
      [goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)']]

[highlight]
  noClasses = false
  # 开启行号；lineNumbersInTable=false 使用内联行号，
  # 避免表格模式下 .lntable{overflow:hidden} 导致长代码被裁切
  lineNos = true
  lineNumbersInTable = false

[tableOfContents]
  startLevel = 2
  endLevel = 4
