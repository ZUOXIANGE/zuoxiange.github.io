# -- 站点配置 --
baseURL = 'https://zuoxiange.github.io/'
title = 'ZUOXIANGE'
theme = 'blowfish'
defaultContentLanguage = 'zh-cn'

enableRobotsTXT = true
summaryLength = 20
hasCJKLanguage = true
enableGitInfo = true

buildDrafts = false
buildFuture = false

enableEmoji = true

[pagination]
  pagerSize = 10

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = 'tags'
  category = 'categories'
  author = 'authors'
  series = 'series'

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

# 为每篇文章额外输出一份 Markdown 原文（用于「下载本文」功能）
[mediaTypes]
  [mediaTypes.'text/markdown']
    suffixes = ['md']

[outputFormats]
  [outputFormats.MD]
    mediaType = 'text/markdown'
    isPlainText = true
    notAlternative = true

[outputs]
  home = ['HTML', 'RSS', 'JSON']
  page = ['HTML', 'MD']

[related]
  threshold = 0
  toLower = false

  [[related.indices]]
    name = 'tags'
    weight = 100

  [[related.indices]]
    name = 'categories'
    weight = 100

  [[related.indices]]
    name = 'series'
    weight = 50

  [[related.indices]]
    name = 'authors'
    weight = 20

  [[related.indices]]
    name = 'date'
    weight = 10

  [[related.indices]]
    applyFilter = false
    name = 'fragmentrefs'
    type = 'fragments'
    weight = 10
