# -- 主题参数 --
# 完整参数说明见 https://blowfish.page/docs/configuration/#theme-parameters

colorScheme = 'blowfish'
defaultAppearance = 'light' # valid options: light or dark
autoSwitchAppearance = true

enableSearch = true
enableCodeCopy = true
enableA11y = true

# mainSections = ['posts']

[header]
  layout = 'basic' # valid options: basic, fixed, fixed-fill, fixed-gradient, fixed-fill-blur, floating

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = 'profile' # valid options: page, profile, hero, card, background, landing, custom
  showRecent = true
  showRecentItems = 5
  showMoreLink = true
  showMoreLinkDest = '/posts/'
  cardView = true
  cardViewScreenWidth = false

[article]
  showDate = true
  showDateUpdated = false
  showAuthor = true
  showHero = false
  showBreadcrumbs = true
  showDraftLabel = true
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = true
  showReadingProgress = true
  showTableOfContents = true
  showTaxonomies = true
  showCategories = true
  showTags = true
  showWordCount = true

[list]
  showBreadcrumbs = false
  showCards = true
  groupByYear = true
  cardView = true
  orderByWeight = false

[taxonomy]
  showTermCount = true

[term]
  showTableOfContents = false
  cardView = true
