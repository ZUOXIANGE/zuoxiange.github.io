# -- 主题参数 --
# 完整参数说明见 https://blowfish.page/docs/configuration/#theme-parameters

colorScheme = 'blowfish'
defaultAppearance = 'light' # valid options: light or dark
autoSwitchAppearance = true

enableSearch = true
enableCodeCopy = true
enableA11y = true
enableStructuredBreadcrumbs = true

mainSections = ['posts', 'notes']

# 站点级背景（backgroundCanvas 将其固定为全站背景）
defaultBackgroundImage = 'img/site-background.svg'
backgroundCanvas = false
# 社交分享默认图（OG / Twitter Card，无特色图时使用）
defaultSocialImage = 'img/banner.png'

# 顶部导航高亮当前区域 / 智能目录
highlightCurrentMenuArea = true
smartTOC = true
smartTOCHideUnfocusedChildren = false

[header]
  layout = 'basic' # valid options: basic, fixed, fixed-fill, fixed-gradient, fixed-fill-blur, floating
  mobileMenuStyle = 'dropdown' # valid options: fullscreen, dropdown

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = 'profile' # valid options: page, profile, hero, card, background, landing, custom
  showRecent = true
  showRecentItems = 6
  showMoreLink = true
  showMoreLinkDest = '/posts/'
  cardView = true
  cardViewScreenWidth = false

[article]
  showDate = true
  showDateUpdated = true
  showAuthor = false
  showHero = false
  showBreadcrumbs = true
  showDraftLabel = true
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = true
  showReadingProgress = true
  showZenMode = true
  showTableOfContents = true
  showTaxonomies = true
  showCategories = true
  showTags = true
  showWordCount = true
  # 文章评论（giscus，见 layouts/partials/comments.html）
  showComments = true
  # 相关文章（基于 related 配置）
  showRelatedContent = true
  relatedContentLimit = 2
  # 系列文章（文章 front matter 中声明 series 后生效）
  seriesOpened = false

[list]
  showBreadcrumbs = false
  showCards = true
  showSummary = true
  groupByYear = true
  cardView = true
  orderByWeight = false
  featureImageHover = true

[taxonomy]
  showTermCount = true
  cardView = true

[term]
  showTableOfContents = false
  cardView = true
  groupByYear = true
